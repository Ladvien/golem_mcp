[project]
name = "trellis2-mcp"
version = "0.1.0"
description = "MCP server wrapping TRELLIS 3D asset generation"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
